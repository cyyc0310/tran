[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcif"
version = "0.1.0"
description = "Zero-shot cross-region carbon intensity forecasting with a physics-informed decomposition layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TransCIF authors" }]
dependencies = [
    "torch>=2.2,<3.0",
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.4,<2.0",
    "scipy>=1.12,<2.0",
    "matplotlib>=3.8,<4.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[project.optional-dependencies]
au-data = ["nemed>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
