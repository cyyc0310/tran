[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcif"
version = "0.2.0"
description = "Public-input probabilistic dispatch transfer for grid carbon intensity forecasting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]
trees = ["scikit-learn>=1.5,<2.0"]
weather = ["eccodes>=2.40,<3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
